spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/caresync_db}
    username: ${SPRING_DATASOURCE_USERNAME:caresync_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

email:
  from: ${MAIL_USERNAME:noreply@caresync.com}
  otp-expiry: 300

logging:
  level:
    root: WARN
    com.caresync: INFO
    org.springframework.web: WARN
  file:
    name: logs/caresync-prod.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
