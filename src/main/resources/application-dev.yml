spring:
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  datasource:
    url: jdbc:mysql://localhost:3306/caresync_dev
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password

server:
  port: 8080

jwt:
  secret: my-dev-secret-key-at-least-256-bits-long-for-development
  expiration: 86400000

email:
  from: noreply@caresync.com
  otp-expiry: 300

logging:
  level:
    root: INFO
    com.caresync: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
